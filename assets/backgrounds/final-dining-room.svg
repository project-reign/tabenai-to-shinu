      <stop offset="0.58" stop-color="#2d1914"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset=".5" stop-color="#7e2c2a"/>
      <stop offset="1" stop-color="#d9a64f"/>
    </linearGradient>
    <radialGradient id="amberGlow">
      <stop offset="0" stop-color="#f3d58a" stop-opacity=".8"/>
      <stop offset=".38" stop-color="#b8732e" stop-opacity=".38"/>
      <stop offset="1" stop-color="#b8732e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#573024"/>
      <stop offset=".5" stop-color="#7e2c2a"/>
      <stop offset="1" stop-color="#2d1914"/>
    </linearGradient>
    <pattern id="grain" width="80" height="40" patternUnits="userSpaceOnUse">
      <path d="M-10 20Q20 3 50 20T110 20" fill="none" stroke="#d9a64f" stroke-opacity=".08" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#08090b"/>

