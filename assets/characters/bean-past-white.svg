<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
  <title id="title">白い土の黒豆・過去</title>
  <desc id="desc">白い土をまとった黒豆が淡い骨色の葉と古い記憶の輪を背負い、懐かしそうに微笑む姿。</desc>
