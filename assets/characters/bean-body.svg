      <stop offset=".48" stop-color="#b8732e"/>
      <stop offset="1" stop-color="#7e2c2a"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4c4b"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
  </defs>


