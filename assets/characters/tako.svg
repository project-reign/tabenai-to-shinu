<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
  <title id="title">寄生タコ</title>
  <desc id="desc">深紅の丸い頭と琥珀色の目を持ち、缶帽子をかぶって八本の触腕で丁寧にお辞儀する少し可愛い寄生タコ。</desc>
  <defs>

    <radialGradient id="halo">
      <stop offset="0" stop-color="#d9a64f" stop-opacity=".28"/>
      <stop offset="1" stop-color="#d9a64f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d58a"/>
      <stop offset=".48" stop-color="#b8732e"/>
      <stop offset="1" stop-color="#7e2c2a"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4c4b"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
  </defs>


