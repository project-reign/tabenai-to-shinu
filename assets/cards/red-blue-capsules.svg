      <path d="M126 650Q400 711 674 650" fill="none" stroke="#d9a64f" stroke-width="17" stroke-linecap="round"/>

      <ellipse cx="400" cy="610" rx="260" ry="67" fill="#d8c8a3" stroke="#d9a64f" stroke-width="15"/>
      <g transform="rotate(-28 300 390)"><rect x="210" y="210" width="180" height="370" rx="90" fill="#b6503f" stroke="#08090b" stroke-width="20"/><path d="M210 395h180" stroke="#d9a64f" stroke-width="15"/><ellipse cx="270" cy="320" rx="19" ry="11" fill="#d9a64f"/><ellipse cx="330" cy="320" rx="19" ry="11" fill="#d9a64f"/></g>
      <g transform="rotate(28 500 390)"><rect x="410" y="210" width="180" height="370" rx="90" fill="#1d4c4b" stroke="#08090b" stroke-width="20"/><path d="M410 395h180" stroke="#d9a64f" stroke-width="15"/><ellipse cx="470" cy="320" rx="19" ry="11" fill="#d9a64f"/><ellipse cx="530" cy="320" rx="19" ry="11" fill="#d9a64f"/></g>
