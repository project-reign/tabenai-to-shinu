    <radialGradient id="cardBg">
      <stop offset="0" stop-color="#573024"/>
      <stop offset=".55" stop-color="#2d1914"/>
      <stop offset="1" stop-color="#08090b"/>
    </radialGradient>
    <radialGradient id="cardGlow">
      <stop offset="0" stop-color="#f3d58a" stop-opacity=".56"/>
      <stop offset="1" stop-color="#d9a64f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="foodWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d58a"/>
      <stop offset=".5" stop-color="#b8732e"/>
      <stop offset="1" stop-color="#7e2c2a"/>
    </linearGradient>
    <linearGradient id="foodCool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65a09a"/>
      <stop offset=".52" stop-color="#1d4c4b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#08090b"/>

