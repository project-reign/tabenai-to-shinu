<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171008">
  <title>演出アセットギャラリー — 食べないと死ぬ v4.7.0</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#100c08;color:#f5ead2}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#392416 0,#171008 42%,#090706 100%);min-height:100vh}
    header{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px max(18px,env(safe-area-inset-right)) 16px max(18px,env(safe-area-inset-left));background:rgba(16,12,8,.93);border-bottom:1px solid #715a31;backdrop-filter:blur(12px)}
    h1,h2,p{margin:0}h1{font-size:clamp(1.05rem,3vw,1.45rem)}a{color:#ffd782}main{width:min(1180px,100%);margin:auto;padding:28px 18px 60px}.intro{color:#cdbf9f;line-height:1.7;margin-bottom:28px}
    section{margin:30px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}.count{color:#d8b86d;font-variant-numeric:tabular-nums}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.asset{overflow:hidden;border:1px solid #5e4927;border-radius:16px;background:#1d1710;box-shadow:0 14px 35px rgba(0,0,0,.25)}
    .asset img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:linear-gradient(145deg,#26180f,#080706)}.asset[data-type="character"] img{aspect-ratio:2/3}.asset[data-type="background"] img{aspect-ratio:16/9;object-fit:cover}
    .meta{padding:12px}.meta strong,.meta small{display:block}.meta strong{color:#ffe4a4}.meta small{color:#aa9d82;margin-top:5px;line-height:1.45;overflow-wrap:anywhere}.badge{display:inline-block;padding:2px 7px;border:1px solid #80652e;border-radius:999px;color:#d8b86d;font-size:.7rem;margin-bottom:7px}
    .empty{padding:20px;border:1px dashed #665638;border-radius:14px;color:#b6aa92}.music{display:grid;gap:9px}.track{display:grid;grid-template-columns:minmax(150px,1fr) auto auto;gap:12px;padding:12px 14px;border:1px solid #5e4927;border-radius:12px;background:#1d1710}.track span{color:#cdbf9f}.error{color:#ffb5a7}
    @media(max-width:520px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.meta{padding:9px}.meta small{font-size:.72rem}.track{grid-template-columns:1fr auto}.track span:last-child{grid-column:1/-1}}
  </style>
</head>
<body>
  <header><h1>演出アセットギャラリー <small>v4.7.0</small></h1><a href="./">ゲームへ戻る</a></header>
  <main>
    <p class="intro">開発・監査用の自動一覧です。表示内容は <code>assets/manifest.json</code> から生成され、画像の代替テキスト、subject、ライセンスID、BGMの生成情報を同時に確認できます。</p>
    <div id="galleryStatus" role="status">台帳を読み込んでいます…</div>
    <div id="gallery"></div>
  </main>
  <script src="./asset-gallery.js"></script>
</body>
</html>
